<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <g fill="none" stroke="#a8801f" stroke-width="1.1">
    <circle cx="200" cy="200" r="22"/>
    <circle cx="200" cy="200" r="38"/>

    <!-- inner ring of eight petals -->
    <g>
      <ellipse cx="200" cy="134" rx="19" ry="28"/>
      <ellipse cx="200" cy="134" rx="19" ry="28" transform="rotate(45 200 200)"/>
