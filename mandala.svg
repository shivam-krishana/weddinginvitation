    <circle cx="200" cy="200" r="158"/>
    <circle cx="200" cy="200" r="190" stroke-dasharray="2 9" stroke-linecap="round"/>
  </g>

  <g fill="#a8801f">
    <circle cx="200" cy="200" r="5"/>
    <circle cx="200" cy="44" r="3"/>
    <circle cx="200" cy="356" r="3"/>
    <circle cx="44" cy="200" r="3"/>
    <circle cx="356" cy="200" r="3"/>
    <circle cx="90" cy="90" r="2.2"/>
    <circle cx="310" cy="90" r="2.2"/>
    <circle cx="90" cy="310" r="2.2"/>
