      <ellipse cx="200" cy="74" rx="11" ry="26"/>
      <ellipse cx="200" cy="74" rx="11" ry="26" transform="rotate(22.5 200 200)"/>
      <ellipse cx="200" cy="74" rx="11" ry="26" transform="rotate(45 200 200)"/>
      <ellipse cx="200" cy="74" rx="11" ry="26" transform="rotate(67.5 200 200)"/>
      <ellipse cx="200" cy="74" rx="11" ry="26" transform="rotate(90 200 200)"/>
      <ellipse cx="200" cy="74" rx="11" ry="26" transform="rotate(112.5 200 200)"/>
      <ellipse cx="200" cy="74" rx="11" ry="26" transform="rotate(135 200 200)"/>
      <ellipse cx="200" cy="74" rx="11" ry="26" transform="rotate(157.5 200 200)"/>
      <ellipse cx="200" cy="74" rx="11" ry="26" transform="rotate(180 200 200)"/>
      <ellipse cx="200" cy="74" rx="11" ry="26" transform="rotate(202.5 200 200)"/>
      <ellipse cx="200" cy="74" rx="11" ry="26" transform="rotate(225 200 200)"/>
      <ellipse cx="200" cy="74" rx="11" ry="26" transform="rotate(247.5 200 200)"/>
      <ellipse cx="200" cy="74" rx="11" ry="26" transform="rotate(270 200 200)"/>
